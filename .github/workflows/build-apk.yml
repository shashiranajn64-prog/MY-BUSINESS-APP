name: Build APK

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build website
        run: npm run build

      - name: Install Capacitor 7
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 --legacy-peer-deps

      - name: Create Capacitor config
        run: |
          rm -rf android
          rm -f capacitor.config.ts capacitor.config.json

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.mybusiness.app",
            "appName": "My Business App",
            "webDir": "dist"
          }
          EOF

          cat capacitor.config.json

      - name: Add Android
        run: npx cap add android

      - name: Copy web files
        run: npx cap copy android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-business-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
