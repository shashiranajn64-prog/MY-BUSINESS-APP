name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: npm install --legacy-peer-deps
      - run: npm run build
      - run: npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
      - run: npx cap init "My Business App" com.mybusiness.app --web-dir=dist
      - run: npx cap add android
      - run: npx cap copy
      - run: cd android && chmod +x gradlew &&./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: my-business-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
