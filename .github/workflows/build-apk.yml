name: Build APK

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build website
        run: npm run build

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Setup Capacitor
        run: |
          rm -rf android
          rm -f capacitor.config.json capacitor.config.ts

          npx cap init "My Business App" com.mybusiness.app --web-dir=dist

          cat capacitor.config.ts

      - name: Add Android
        run: npx cap add android

      - name: Copy web files
        run: npx cap copy android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-business-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
